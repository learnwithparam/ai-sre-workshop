# Every source the teaching pages cite still answers.
#
# Its own job rather than a step in check, because it needs the network: inside
# `make check` a rotted link would fail a pull request that has nothing to do with
# it, and a gate that cries wolf is a gate people learn to skip. Weekly, plus
# whenever the list or a page that cites it changes.
name: links

on:
  schedule:
    - cron: "0 7 * * 1"
  push:
    paths:
      - sources.json
      - concepts.html
      - teach.html
      - scripts/check_links.py
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.x"
      - name: Every cited source resolves
        run: uv run --quiet python scripts/check_links.py
