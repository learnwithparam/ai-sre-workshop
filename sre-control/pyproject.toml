[project]
name = "sre-control"
version = "1.0.0"
description = "AI SRE control plane: detector, MCP tools, approval pages and remediation runner"
requires-python = ">=3.13"
dependencies = [
    "fastmcp==4.0.3",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "clickhouse-connect==1.8.0",
    "pydantic==2.13.5",
    "opentelemetry-distro==0.65b0",
    "opentelemetry-exporter-otlp==1.44.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sre_control"]
