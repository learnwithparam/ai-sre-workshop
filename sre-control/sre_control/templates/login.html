{% extends "base.html" %}
{% block title %}Sign in · sre-control{% endblock %}
{% block main %}
<div class="panel" style="max-width: 420px; margin: 40px auto;">
  <h1>Sign in to approve</h1>
  <p class="muted">Every approval and rejection is recorded against this account.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <p><button class="btn primary" type="submit">Sign in</button></p>
  </form>
</div>
{% endblock %}
