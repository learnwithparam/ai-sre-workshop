{% extends "base.html" %}
{% block title %}Sign in · AI SRE Control{% endblock %}
{% block main %}
<div class="panel" style="max-width: 440px; margin: 6vh auto;">
  <div class="stack">
    <h1>Sign in</h1>
    <p class="muted">Every approval and rejection is recorded against this account, with the time it
      was made.</p>
  </div>
  {% if error %}<p class="notice error">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <p><button class="btn primary" type="submit">Sign in</button></p>
  </form>
</div>
{% endblock %}
