<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}sre-control{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f5f2; --panel: #ffffff; --ink: #1b1d1f; --muted: #62676d; --line: #e3e1dc;
      --accent: #0f6b4f; --warn: #a15c07; --bad: #b42318; --info: #1d4ed8;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 -apple-system, "Segoe UI", Inter, sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 14px 28px;
             background: var(--ink); color: #f6f5f2; }
    header a { color: inherit; text-decoration: none; font-weight: 600; letter-spacing: .01em; }
    header .who { color: #b9bdc2; font-size: 13px; }
    main { max-width: 1080px; margin: 0 auto; padding: 28px; }
    h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -.01em; }
    h2 { font-size: 15px; margin: 28px 0 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
    .muted { color: var(--muted); }
    .mono, code { font-family: var(--mono); font-size: 13px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    a { color: var(--info); }
    .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
            border: 1px solid currentColor; }
    .pill.open, .pill.pending { color: var(--warn); }
    .pill.approved, .pill.executed, .pill.resolved { color: var(--accent); }
    .pill.rejected, .pill.failed { color: var(--bad); }
    .btn { display: inline-block; border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; font-weight: 600;
           cursor: pointer; text-decoration: none; }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn.danger { background: #fff; color: var(--bad); border: 1px solid var(--bad); }
    .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .btn.ai { background: var(--ink); color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
    input, select, textarea { width: 100%; font: inherit; padding: 9px 10px; border: 1px solid var(--line);
                              border-radius: 8px; background: #fff; }
    .timeline { list-style: none; margin: 0; padding: 0; }
    .timeline li { display: grid; grid-template-columns: 170px 190px 1fr; gap: 14px; padding: 10px 0;
                   border-bottom: 1px solid var(--line); }
    .timeline time { font-family: var(--mono); font-size: 13px; color: var(--muted); }
    .kind { font-weight: 600; }
    .error { background: #fdecea; color: var(--bad); border-radius: 8px; padding: 10px 14px; margin: 12px 0; }
    @media (max-width: 720px) { .timeline li { grid-template-columns: 1fr; gap: 2px; } main { padding: 16px; } }
  </style>
</head>
<body>
  <header>
    <a href="/">sre-control</a>
    {% if who %}<span class="who">Signed in as {{ who }}</span>{% endif %}
  </header>
  <main>{% block main %}{% endblock %}</main>
</body>
</html>
