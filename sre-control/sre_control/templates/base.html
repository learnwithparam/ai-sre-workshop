<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI SRE Control{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    /* The console shares the product's palette: near-black surfaces, one yellow for the action
       a human takes, and semantic colours reserved for state. */
    :root {
      --ground: #0a0c0e;
      --surface: #101418;
      --surface-raised: #151a20;
      --field: #0d1114;
      --line: #232a31;
      --line-strong: #323b44;
      --ink: #eef2f5;
      --ink-muted: #9fadb9;
      --ink-faint: #76838e;
      --accent: #fbff3a;
      --accent-dim: #d9dd23;
      --accent-ink: #0a0c0e;
      --wait: #f5b942;
      --wait-ground: #241d0d;
      --good: #35c48b;
      --good-ground: #0f2119;
      --bad: #ff7a7a;
      --bad-ground: #241315;
      --radius: 12px;
      --radius-sm: 8px;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--ground); color: var(--ink);
           font: 400 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
    a { color: var(--ink); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

    header.top { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 12px 24px;
                 align-items: center; justify-content: space-between;
                 padding: 14px clamp(20px, 4vw, 40px); background: rgba(10, 12, 14, 0.9);
                 backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
             font-weight: 600; letter-spacing: -0.01em; }
    .brand .mark { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px;
                   background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 700; }
    .who { color: var(--ink-faint); font-size: 0.85rem; }

    main { max-width: 1080px; margin: 0 auto; padding: clamp(24px, 4vw, 44px) clamp(20px, 4vw, 40px) 72px; }
    .lede { color: var(--ink-muted); max-width: 70ch; }
    h1 { font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 600; letter-spacing: -0.02em; margin: 0; line-height: 1.2; }
    h2 { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;
         color: var(--ink-faint); margin: 0; }
    h3 { font-size: 1rem; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
    p { margin: 0; }
    .stack { display: grid; gap: 12px; }
    .section { display: grid; gap: 12px; margin-top: 36px; }
    .muted { color: var(--ink-muted); }
    .mono, code, pre { font-family: var(--mono); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
    .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-family: var(--mono);
              font-size: 0.8rem; color: var(--ink-faint); margin-bottom: 14px; }
    .crumbs a { color: var(--ink-muted); text-decoration: none; }
    .crumbs a:hover { color: var(--ink); text-decoration: underline; }

    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
             padding: 20px 22px; display: grid; gap: 14px; align-content: start; }
    .panel.tight { padding: 0; overflow: hidden; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
    .title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }

    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tbody tr:last-child td { border-bottom: 0; }
    th { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
         color: var(--ink-faint); background: var(--surface-raised); }
    td a { color: var(--ink); }
    .facts th { background: transparent; text-transform: none; letter-spacing: 0; font-size: 0.85rem;
                color: var(--ink-muted); width: 34%; font-weight: 500; }

    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 999px;
            font-size: 0.78rem; font-weight: 600; letter-spacing: 0.01em; border: 1px solid currentColor; }
    .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pill[data-state="open"], .pill[data-state="pending"] { color: var(--wait); background: var(--wait-ground); }
    .pill[data-state="approved"], .pill[data-state="executed"],
    .pill[data-state="resolved"], .pill[data-state="passed"] { color: var(--good); background: var(--good-ground); }
    .pill[data-state="rejected"], .pill[data-state="failed"] { color: var(--bad); background: var(--bad-ground); }

    .chip { display: inline-block; padding: 2px 10px; border-radius: 6px; background: var(--field);
            border: 1px solid var(--line-strong); font-family: var(--mono); font-size: 0.82rem; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent;
           border-radius: var(--radius-sm); padding: 11px 20px; font: inherit; font-weight: 600; font-size: 0.95rem;
           cursor: pointer; text-decoration: none; transition: background 0.15s ease, border-color 0.15s ease; }
    .btn.primary { background: var(--accent); color: var(--accent-ink); }
    .btn.primary:hover { background: var(--accent-dim); }
    .btn.danger { background: transparent; color: var(--bad); border-color: rgba(255, 122, 122, 0.5); }
    .btn.danger:hover { background: var(--bad-ground); }
    .btn.ghost { background: var(--field); color: var(--ink); border-color: var(--line-strong); }
    .btn.ghost:hover { border-color: var(--ink-faint); }
    .btn.ai { background: var(--field); color: var(--ink); border-color: var(--accent); }
    .btn.ai:hover { background: var(--surface-raised); }

    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    input, select, textarea { width: 100%; font: inherit; font-size: 0.95rem; padding: 10px 12px;
                              border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
                              background: var(--field); color: var(--ink); }
    textarea { resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent);
                                                box-shadow: 0 0 0 3px rgba(251, 255, 58, 0.16); }
    .field { display: grid; }

    .timeline { list-style: none; margin: 0; padding: 0; display: grid; }
    .timeline li { display: grid; grid-template-columns: 150px 210px minmax(0, 1fr); gap: 18px;
                   padding: 14px 0; border-bottom: 1px solid var(--line); }
    .timeline li:last-child { border-bottom: 0; }
    .timeline time { font-family: var(--mono); font-size: 0.82rem; color: var(--ink-faint); }
    .timeline .kind { font-weight: 600; display: block; }
    .timeline .actor { color: var(--ink-faint); font-size: 0.85rem; }
    .timeline .detail { color: var(--ink-muted); min-width: 0; overflow-wrap: anywhere; }
    .timeline .detail code { color: var(--ink); }

    .evidence { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    .evidence li { font-family: var(--mono); font-size: 0.82rem; background: var(--field);
                   border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; overflow-wrap: anywhere; }

    .notice { border-radius: var(--radius-sm); padding: 12px 16px; border: 1px solid transparent; }
    .notice.error { background: var(--bad-ground); border-color: rgba(255, 122, 122, 0.4); color: var(--bad); }

    pre.output { background: var(--field); border: 1px solid var(--line); border-radius: var(--radius-sm);
                 padding: 12px 14px; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-muted); }

    @media (max-width: 720px) {
      .timeline li { grid-template-columns: 1fr; gap: 4px; }
      th, td { padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><span class="mark" aria-hidden="true">AI</span>AI SRE Control</a>
    {% if who %}<span class="who">Signed in as {{ who }}</span>{% endif %}
  </header>
  <main>{% block main %}{% endblock %}</main>
</body>
</html>
